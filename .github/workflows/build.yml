name: Build APK
run-name: "build ${{ inputs.job || 'bootstrap' }}"

# طريقتان للتشغيل:
#  1) رفع ملف zip واحد إلى جذر المستودع (push) فيُبنى تلقائياً.
#  2) تشغيل يدوي/من التطبيق (workflow_dispatch) مع job = jobs/<job>/project.zip

on:
  workflow_dispatch:
    inputs:
      job:
        description: "معرّف المهمة (jobs/<id>/project.zip). فارغ = zip في جذر المستودع"
        required: false
        default: ""
      variant:
        description: "debug أو release"
        required: false
        default: "debug"
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB: ${{ inputs.job }}
      VARIANT: ${{ inputs.variant || 'debug' }}
      KS_PASS: apkbuilder-ci
      KS_ALIAS: apkbuilder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "تجهيز المشروع"
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/apk_in"
          LOG="$GITHUB_WORKSPACE/logs/build.log"
          die() { echo "ERROR: $*" | tee -a "$LOG"; echo "::error::$*"; exit 1; }

          ZIP=""
          if [ -n "$JOB" ]; then
            case "$JOB" in *[!A-Za-z0-9._-]*) die "معرّف المهمة غير صالح: $JOB";; esac
            ZIP="jobs/$JOB/project.zip"
          else
            ZIP="$(git diff-tree --root --no-commit-id --name-only -r HEAD -- '*.zip' 2>/dev/null | grep -v / | head -n 1 || true)"
            if [ -z "$ZIP" ]; then ZIP="$(ls -t ./*.zip 2>/dev/null | head -n 1 | sed 's|^\./||' || true)"; fi
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::notice::لا يوجد ملف zip للبناء. ارفع ملف zip إلى جذر المستودع."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "الحزمة: $ZIP" | tee -a "$LOG"

          SRC="$RUNNER_TEMP/src"
          rm -rf "$SRC"; mkdir -p "$SRC"
          unzip -q -o "$ZIP" -d "$SRC" || die "تعذّر فك الضغط: الملف ليس zip صالحاً"

          SETTINGS="$(find "$SRC" \( -name settings.gradle -o -name settings.gradle.kts \) \
            | awk '{ n = gsub("/", "/"); print n " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          [ -n "$SETTINGS" ] || die "لا يوجد settings.gradle في الحزمة: ليست مشروع أندرويد (Gradle)"
          ROOT="$(dirname "$SETTINGS")"
          echo "جذر المشروع: ${ROOT#"$SRC"/}" | tee -a "$LOG"

          GV="8.9"
          WP="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WP" ]; then
            V="$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' "$WP" | head -n 1)"
            if [ -n "$V" ]; then GV="$V"; fi
          fi
          HAS_WRAPPER="no"
          if [ -f "$ROOT/gradlew" ] && [ -f "$ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then HAS_WRAPPER="yes"; fi
          echo "Gradle: $GV (wrapper: $HAS_WRAPPER)" | tee -a "$LOG"

          {
            echo "found=true"
            echo "root=$ROOT"
            echo "gv=$GV"
            echo "wrapper=$HAS_WRAPPER"
          } >> "$GITHUB_OUTPUT"

      - name: "تنزيل Gradle"
        if: steps.prep.outputs.found == 'true' && steps.prep.outputs.wrapper != 'yes'
        shell: bash
        env:
          GV: ${{ steps.prep.outputs.gv }}
        run: |
          set -euo pipefail
          get() { curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$1-bin.zip"; }
          if ! get "$GV"; then
            echo "::warning::تعذّر تنزيل Gradle $GV، أستخدم 8.9"
            GV="8.9"; get "$GV"
          fi
          unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$RUNNER_TEMP/gradle-$GV/bin/gradle" >> "$GITHUB_ENV"

      - name: "ذاكرة Gradle المؤقتة"
        if: steps.prep.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: "قبول تراخيص SDK"
        if: steps.prep.outputs.found == 'true'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: "بناء APK"
        if: steps.prep.outputs.found == 'true'
        shell: bash
        env:
          ROOT: ${{ steps.prep.outputs.root }}
          WRAPPER: ${{ steps.prep.outputs.wrapper }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/logs/build.log"
          cd "$ROOT"
          rm -f local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ "$WRAPPER" = "yes" ]; then chmod +x ./gradlew; GRADLE="./gradlew"; else GRADLE="$GRADLE_BIN"; fi
          TASK="assembleDebug"
          if [ "$VARIANT" = "release" ]; then TASK="assembleRelease"; fi
          echo "المهمة: $TASK" | tee -a "$LOG"

          set +e
          "$GRADLE" --no-daemon --console=plain --warning-mode summary "$TASK" 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then echo "::error::فشل Gradle (الرمز $RC)"; exit "$RC"; fi

          COUNT=0
          while IFS= read -r f; do
            cp "$f" "$GITHUB_WORKSPACE/apk_in/"
            COUNT=$((COUNT + 1))
          done < <(find . -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*androidTest*')
          if [ "$COUNT" -eq 0 ]; then echo "ERROR: لم يُنتج البناء أي APK" | tee -a "$LOG"; exit 1; fi

      - name: "توقيع APK"
        if: steps.prep.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/logs/build.log"
          cd "$GITHUB_WORKSPACE"

          # مفتاح توقيع ثابت داخل المستودع ليبقى التحديث ممكناً فوق النسخة المثبّتة
          if [ ! -f signing/keystore.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/keystore.p12 -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=ApkBuilder, O=Personal, C=SY"
            git config user.name "apk-builder"
            git config user.email "apk-builder@users.noreply.github.com"
            git add signing/keystore.p12
            git commit -q -m "Add signing key"
            if ! { git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; }; then
              echo "::warning::تعذّر حفظ مفتاح التوقيع في المستودع؛ سيتغيّر التوقيع في كل بناء."
            fi
          fi

          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          TMP="$RUNNER_TEMP/sign"; mkdir -p "$TMP"

          for f in apk_in/*.apk; do
            b="$(basename "$f" .apk)"; b="${b%-unsigned}"
            cp "$f" "$TMP/$b.apk"
            zip -q -d "$TMP/$b.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' > /dev/null 2>&1 || true
            "$ZIPALIGN" -f -p 4 "$TMP/$b.apk" "$TMP/$b-aligned.apk"
            "$APKSIGNER" sign --ks signing/keystore.p12 --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --ks-key-alias "$KS_ALIAS" --out "out/$b.apk" "$TMP/$b-aligned.apk"
            "$APKSIGNER" verify --print-certs "out/$b.apk" | tee -a "$LOG"
          done
          ls -l out | tee -a "$LOG"

      - name: "رفع النتيجة (APK)"
        if: steps.prep.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job || 'bootstrap' }}
          path: out/*.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: "رفع سجل البناء"
        if: always() && steps.prep.outputs.found != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.job || 'bootstrap' }}
          path: logs/build.log
          retention-days: 7
          if-no-files-found: ignore
