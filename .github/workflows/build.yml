name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -q project.zip -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd "$PROJ_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Blackout-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
